<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h2 id="salom">Yuklanmoqda...</h2>
  <button onclick="Telegram.WebApp.close()">Yopish</button>
  <script>
    const tg = Telegram.WebApp;
    tg.ready();
    tg.expand();
    const u = tg.initDataUnsafe.user;
    document.getElementById("salom").innerText =
      "Salom, " + (u ? u.first_name : "mehmon") + "!";
  </script>
</body>
</html>
